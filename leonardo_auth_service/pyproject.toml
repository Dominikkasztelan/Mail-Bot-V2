[project]
name = "leonardo-auth-service"
version = "0.1.0"
description = "High-stealth authentication microservice for Leonardo.ai"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "playwright>=1.41.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "fake-useragent>=1.4.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "..:."

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
