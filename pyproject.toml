[project]
name = "Bot_mail_creator"
version = "0.1.0"
description = "Bot mail creator project"
authors = [{name = "Your Name", email = "your.email@example.com"}]
dependencies = [
    "playwright",
    "pytest",
    "python-dotenv",
]
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "W", "I", "N", "UP", "PL", "RUF"]
ignore = []

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q -v --tb=short"
testpaths = [
    "tests",
]
log_cli = true
log_cli_level = "INFO"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
